
<div>
    <div class="2colrow">
        <div class="col">
            <h3>Unit Information</h3>
            <label>Name:</label><input type="text" name="attr_character_name">
            <br>
            <label>Type:</label><input type="text" name="attr_type">
            <select name="attr_type">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Infantry Squad">Infantry Squad</option>
                <option value="Infantry Team">Infantry Team</option>
                <option value="Leader">Leader</option>
                <option value="Light Support">Light Support</option>
                <option value="Heavy Support">Heavy Support</option>
                <option value="Expendable Support">Expendable Support</option>
                <option value="AFV">AFV</option>
                <option value="Gun">Gun</option>
                <option value="Vehicle">Vehicle</option>
            </select>
            <br>
            <label for="attr_nation">Nation:</label>
            <select name="attr_nation">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="German">German</option>
                <option value="USA">USA</option>
            </select>
            <br>
            <h3>Infantry Info</h3>
            <label>APFP:</label><input type="text" name="attr_ap">
            <br>
            <label>Range:</label><input type="text" name="attr_range">
            <br>
            <label>Casualty Rating:</label><input type="text" name="attr_casualty">
            <br>
            <label>Elite:</label><input type="checkbox" name="attr_elite">
            <label>Leadership Modifier:</label><input type="text" name="attr_leadership">
            <br>
            <h3>Support Weapon Info</h3>
            <label>APFP:</label><input type="text" name="attr_ap">
            <br>
            <label>ATFP:</label><input type="text" name="attr_at">
            <br>
            <label>Range:</label><input type="text" name="attr_range">
            <br>
            <h3>AFV Info</h3>
            <label>Gun APFP:</label><input type="text" name="attr_gunap">
            <label>Gun ATFP:</label><input type="text" name="attr_gunat">
            <label>Gun 360:</label><input type="checkbox" name="attr_gun360">
            <label>MG1 APFP:</label><input type="text" name="attr_mg1ap">
            <label>MG1 360:</label><input type="checkbox" name="attr_mg1360">
            <label>MG2 APFP:</label><input type="text" name="attr_mg2ap">
            <label>MG2 360:</label><input type="checkbox" name="attr_mg2360">
            <label>Movement Points:</label><input type="text" name="attr_move">
            <label>Front Armour:</label><input type="text" name="attr_frontarmour">
            <label>Rear/Side Armour:</label><input type="text" name="attr_reararmour">
            <h3>Gun Info</h3>
            <label>Gun APFP:</label><input type="text" name="attr_gunap">
            <label>Gun ATFP:</label><input type="text" name="attr_gunat">
            <label>Gun Shield:</label><input type="checkbox" name="attr_gunshield">
            <label>Movement Points:</label><input type="text" name="attr_move">
            <label>Casualty Rating:</label><input type="text" name="attr_casualty">
            <h3>Vehicle Info</h3>
            <label>Casualty Rating:</label><input type="text" name="attr_casualty">
            <label>Transport Class:</label><input type="text" name="attr_transportclass">
            <label>Tow Ability:</label><input type="text" name="attr_tow">
            <label>Movement Points:</label><input type="text" name="attr_move">
        </div>
    </div>
</div>
